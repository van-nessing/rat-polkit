[package]
name = "rat-polkit"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
etc-passwd = "0.2.2"
futures-concurrency = "7.7.1"
getrandom = "0.4.3"
hex = "0.4.3"
pin-project = "1.1.13"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smol = "2.0.2"
zbus = "5.16.0"
zeroize = { version = "1.9.0", features = ["derive", "serde"] }
